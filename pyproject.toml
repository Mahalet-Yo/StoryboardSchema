[project]
name = "heritage-short"
version = "1.0.0"
description = "storyboard.json -> narrated, scored, subtitled 60-90 s film in 9:16 and 16:9"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
